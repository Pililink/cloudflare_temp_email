name: Upstream Sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream changes
        shell: bash
        run: |
          set -euo pipefail

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/dreamhunter2333/cloudflare_temp_email.git
          else
            git remote add upstream https://github.com/dreamhunter2333/cloudflare_temp_email.git
          fi

          git fetch upstream main

          if git merge --no-commit --no-ff upstream/main; then
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -z "$conflicts" ]; then
            echo "Merge failed without conflict details."
            exit 1
          fi

          unexpected="$(printf '%s\n' "$conflicts" | grep -vx '.github/workflows/sync.yaml' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected conflicts:\n%s\n' "$unexpected"
            git merge --abort
            exit 1
          fi

          git checkout --ours .github/workflows/sync.yaml
          git add .github/workflows/sync.yaml

      - name: Restore local sync workflow
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/sync.yaml
          git add .github/workflows/sync.yaml

      - name: Commit merged changes
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git add .
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit -m "ci: keep local upstream sync workflow"
          else
            echo "No changes to commit."
          fi

      - name: Push changes
        shell: bash
        run: git push origin main
